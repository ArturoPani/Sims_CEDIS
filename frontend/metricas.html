<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEDIS Sim — Comparador de Métricas</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    /* ── Overrides específicos de esta página ── */
    body { height: auto; min-height: 100vh; }

    .page-content {
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }

    /* ── Panel izquierdo: configuración ── */
    .config-panel {
      width: 320px;
      min-width: 320px;
      background: #16213e;
      border-right: 2px solid #0f3460;
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .config-panel h2 {
      font-size: 13px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .config-panel select {
      width: 100%;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #0f3460;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .config-panel select:focus {
      outline: none;
      border-color: #00d4ff;
    }

    /* ── Checkboxes de métricas ── */
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .metric-check {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 11px;
      transition: border-color 0.15s;
    }
    .metric-check:hover { border-color: #00d4ff44; }
    .metric-check input[type=checkbox] { cursor: pointer; accent-color: #00d4ff; }
    .metric-check.checked { border-color: #00d4ff; background: #0d2342; }
    .orient-higher { color: #00e676; font-size: 9px; margin-left: auto; }
    .orient-lower  { color: #ff9100; font-size: 9px; margin-left: auto; }

    .select-actions { display: flex; gap: 6px; margin-bottom: 4px; }
    .select-actions button { font-size: 11px; padding: 4px 10px; }

    /* ── Botón comparar ── */
    #btnComparar {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Panel derecho: resultados ── */
    .results-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .run-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      min-width: 160px;
    }
    .run-card .label { color: #888; font-size: 10px; text-transform: uppercase; }
    .run-card .value { color: #00d4ff; font-size: 15px; font-weight: 700; }
    .run-card .meta  { color: #aaa; font-size: 11px; margin-top: 2px; }

    /* ── Chart ── */
    .chart-container {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 16px;
    }
    .chart-container h3 { font-size: 13px; color: #00d4ff; margin-bottom: 12px; }

    /* ── Tabla de resultados ── */
    .results-table-wrap {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
    }
    .results-table-wrap h3 { font-size: 13px; color: #00d4ff; margin-bottom: 12px; }
    .results-table-wrap table { font-size: 12px; }
    .results-table-wrap th { font-size: 11px; }

    .estado-MEJORA     { color: #69f0ae; font-weight: 700; }
    .estado-EMPEORA    { color: #ff5252; font-weight: 700; }
    .estado-SIN_CAMBIO { color: #888; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 15px;
      gap: 10px;
    }
    .empty-state .icon { font-size: 48px; }

    /* ── Resumen ── */
    .summary-cards {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .summary-card {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 12px 20px;
      text-align: center;
      min-width: 100px;
    }
    .summary-card .s-num  { font-size: 28px; font-weight: 700; }
    .summary-card .s-lbl  { font-size: 11px; color: #888; margin-top: 2px; }
    .s-num.green { color: #00e676; }
    .s-num.red   { color: #ff5252; }
    .s-num.gray  { color: #666; }
    .s-num.cyan  { color: #00d4ff; }

    /* ── Runs table ── */
    .runs-list { margin-top: 4px; font-size: 11px; max-height: 160px; overflow-y: auto; }
    .runs-list table { width: 100%; }
    .empty-runs { color: #555; font-size: 11px; padding: 8px 0; }

    /* ── Loading ── */
    .loading { color: #888; font-size: 12px; padding: 8px 0; }
  </style>
</head>
<body>

<!-- ═══ Top bar ═══ -->
<div class="topbar">
  <h1>CEDIS Sim</h1>
  <nav style="display:flex; gap:6px;">
    <a href="/" style="color:#aaa; text-decoration:none; padding:4px 12px; border:1px solid #0f3460; border-radius:4px; font-size:12px;">
      🤖 Simulación
    </a>
    <span style="color:#00d4ff; padding:4px 12px; border:1px solid #00d4ff33; border-radius:4px; font-size:12px; background:#0d2342;">
      📊 Métricas
    </span>
    <a href="/experimento-page" style="color:#aaa; text-decoration:none; padding:4px 12px; border:1px solid #0f3460; border-radius:4px; font-size:12px;">
      🧪 Experimento
    </a>
    <a href="/logout" style="color:#ff5252; text-decoration:none; padding:4px 12px; border:1px solid #ff525244; border-radius:4px; font-size:12px; margin-left:auto;">
      🚪 Salir
    </a>
  </nav>
  <label style="margin-left:auto; font-size:12px;">Escenario:
    <select id="selEscenario" onchange="cargarRuns()">
      <option value="">Todos</option>
      <option value="benchmark">benchmark</option>
      <option value="pasillosDirigidos">pasillosDirigidos</option>
    </select>
  </label>
</div>

<div class="page-content">

  <!-- ══ Panel izquierdo ══ -->
  <div class="config-panel">

    <!-- Selector de runs -->
    <div class="section" style="border-bottom:1px solid #0f3460; padding-bottom:14px;">
      <h2>Corridas disponibles</h2>
      <div id="loadingRuns" class="loading">Cargando...</div>
      <div id="runsTable" class="runs-list" style="display:none;"></div>
    </div>

    <!-- Run base -->
    <div class="section" style="border-bottom:1px solid #0f3460; padding-bottom:14px;">
      <h2>Run base (benchmark)</h2>
      <div class="form-group">
        <label for="selBase">Seleccionar run</label>
        <select id="selBase">
          <option value="">— Selecciona —</option>
        </select>
      </div>
    </div>

    <!-- Run actual -->
    <div class="section" style="border-bottom:1px solid #0f3460; padding-bottom:14px;">
      <h2>Run a comparar</h2>
      <div class="form-group">
        <label for="selActual">Seleccionar run</label>
        <select id="selActual">
          <option value="">— Selecciona —</option>
        </select>
      </div>
    </div>

    <!-- Selector de métricas -->
    <div class="section" style="border-bottom:1px solid #0f3460; padding-bottom:14px;">
      <h2>Métricas a comparar</h2>
      <div class="select-actions">
        <button onclick="toggleAll(true)">Seleccionar todo</button>
        <button onclick="toggleAll(false)">Limpiar</button>
      </div>
      <div class="metric-grid" id="metricGrid">
        <div class="loading">Cargando...</div>
      </div>
    </div>

    <!-- Botón -->
    <button id="btnComparar" class="success" onclick="comparar()">
      📊 Comparar
    </button>
    <div id="infoComparar" style="font-size:11px; min-height:16px;"></div>

  </div>

  <!-- ══ Panel derecho ══ -->
  <div class="results-panel" id="resultsPanel">
    <div class="empty-state" id="emptyState">
      <span class="icon">📊</span>
      <span>Selecciona dos runs y las métricas que quieres comparar</span>
    </div>
  </div>

</div>

<script>
const API = '';
let allRuns = [];
let metricasDef = [];  // [{clave, etiqueta, orientacion}]

// ════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([cargarRuns(), cargarMetricasDef()]);
});

// ════════════════════════════════════════════════════════════════
//  CARGAR RUNS
// ════════════════════════════════════════════════════════════════
async function cargarRuns() {
  const esc = document.getElementById('selEscenario').value;
  const url = esc ? `${API}/metricas/runs?escenario=${esc}` : `${API}/metricas/runs`;
  document.getElementById('loadingRuns').style.display = '';
  document.getElementById('runsTable').style.display = 'none';

  try {
    const r = await fetch(url);
    allRuns = await r.json();

    renderRunsTable(allRuns);
    renderSelects(allRuns);
  } catch(e) {
    document.getElementById('loadingRuns').textContent = 'Error cargando runs';
  }
}

function renderRunsTable(runs) {
  const el = document.getElementById('runsTable');
  document.getElementById('loadingRuns').style.display = 'none';
  el.style.display = '';

  if (!runs.length) {
    el.innerHTML = '<p class="empty-runs">Sin corridas guardadas aún. Inicia una simulación y presiona "Guardar Métricas".</p>';
    return;
  }

  el.innerHTML = `<table>
    <thead><tr><th>ID</th><th>Escenario</th><th>Fecha</th><th>✓</th></tr></thead>
    <tbody>
      ${runs.map(r => `<tr>
        <td style="color:#00d4ff">#${r.run_id}</td>
        <td>${r.escenario}</td>
        <td style="color:#888;">${formatFecha(r.fecha)}</td>
        <td style="color:#69f0ae;">${r.pedidos_completados ?? '--'}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderSelects(runs) {
  const opts = runs.map(r =>
    `<option value="${r.run_id}">#${r.run_id} — ${r.escenario} — ${formatFecha(r.fecha)} (${r.pedidos_completados ?? '?'} pedidos)</option>`
  ).join('');
  const placeholder = '<option value="">— Selecciona —</option>';
  document.getElementById('selBase').innerHTML = placeholder + opts;
  document.getElementById('selActual').innerHTML = placeholder + opts;
}

function formatFecha(f) {
  if (!f || f === 'None') return '—';
  const d = new Date(f);
  if (isNaN(d)) return f;
  return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'2-digit',
    hour:'2-digit', minute:'2-digit' });
}

// ════════════════════════════════════════════════════════════════
//  MÉTRICAS DISPONIBLES
// ════════════════════════════════════════════════════════════════
async function cargarMetricasDef() {
  try {
    const r = await fetch(`${API}/metricas/disponibles`);
    metricasDef = await r.json();
    renderMetricGrid(metricasDef);
  } catch(e) {
    document.getElementById('metricGrid').innerHTML = '<span style="color:#ff5252">Error</span>';
  }
}

function renderMetricGrid(mets) {
  const grid = document.getElementById('metricGrid');
  grid.innerHTML = mets.map(m => `
    <label class="metric-check" id="lbl_${m.clave}">
      <input type="checkbox" value="${m.clave}" checked
             onchange="updateCheckStyle('${m.clave}')">
      <span>${m.etiqueta}</span>
      <span class="orient-${m.orientacion}">${m.orientacion === 'higher' ? '↑' : '↓'}</span>
    </label>
  `).join('');
}

function updateCheckStyle(clave) {
  const lbl = document.getElementById(`lbl_${clave}`);
  const chk = lbl.querySelector('input');
  lbl.classList.toggle('checked', chk.checked);
}

function toggleAll(state) {
  document.querySelectorAll('#metricGrid input[type=checkbox]').forEach(cb => {
    cb.checked = state;
    updateCheckStyle(cb.value);
  });
}

// ════════════════════════════════════════════════════════════════
//  COMPARAR
// ════════════════════════════════════════════════════════════════
let chartInstance = null;

async function comparar() {
  const base   = parseInt(document.getElementById('selBase').value);
  const actual = parseInt(document.getElementById('selActual').value);

  if (!base || !actual) {
    document.getElementById('infoComparar').innerHTML =
      '<span style="color:#ff5252">Selecciona ambos runs primero</span>';
    return;
  }
  if (base === actual) {
    document.getElementById('infoComparar').innerHTML =
      '<span style="color:#ff9100">Los runs deben ser diferentes</span>';
    return;
  }

  const metricas = [...document.querySelectorAll('#metricGrid input:checked')]
    .map(cb => cb.value);
  if (!metricas.length) {
    document.getElementById('infoComparar').innerHTML =
      '<span style="color:#ff5252">Selecciona al menos una métrica</span>';
    return;
  }

  document.getElementById('infoComparar').innerHTML =
    '<span style="color:#888">Comparando...</span>';
  document.getElementById('btnComparar').disabled = true;

  try {
    const res = await fetch(`${API}/metricas/comparar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ run_id_base: base, run_id_actual: actual, metricas })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Error');

    document.getElementById('infoComparar').innerHTML = '';
    renderResultados(data);
  } catch(e) {
    document.getElementById('infoComparar').innerHTML =
      `<span style="color:#ff5252">${e.message}</span>`;
  } finally {
    document.getElementById('btnComparar').disabled = false;
  }
}

// ════════════════════════════════════════════════════════════════
//  RENDER RESULTADOS
// ════════════════════════════════════════════════════════════════
function renderResultados(data) {
  const panel = document.getElementById('resultsPanel');
  const resultados = data.resultados.slice().sort((a, b) => b.score - a.score);

  const mejoras   = resultados.filter(r => r.estado === 'MEJORA').length;
  const empeoras  = resultados.filter(r => r.estado === 'EMPEORA').length;
  const iguales   = resultados.filter(r => r.estado === 'SIN_CAMBIO').length;
  const mejor     = resultados[0];
  const peor      = resultados[resultados.length - 1];

  panel.innerHTML = `
    <!-- Run cards -->
    <div class="result-header">
      <div class="run-card">
        <div class="label">Run base (benchmark)</div>
        <div class="value">#${data.run_base.run_id}</div>
        <div class="meta">${data.run_base.escenario} · ${formatFecha(data.run_base.fecha)}</div>
      </div>
      <div style="font-size:22px; color:#444;">→</div>
      <div class="run-card">
        <div class="label">Run comparado</div>
        <div class="value">#${data.run_actual.run_id}</div>
        <div class="meta">${data.run_actual.escenario} · ${formatFecha(data.run_actual.fecha)}</div>
      </div>
    </div>

    <!-- Resumen -->
    <div class="summary-cards">
      <div class="summary-card">
        <div class="s-num cyan">${resultados.length}</div>
        <div class="s-lbl">Métricas</div>
      </div>
      <div class="summary-card">
        <div class="s-num green">${mejoras}</div>
        <div class="s-lbl">Mejoran</div>
      </div>
      <div class="summary-card">
        <div class="s-num red">${empeoras}</div>
        <div class="s-lbl">Empeoran</div>
      </div>
      <div class="summary-card">
        <div class="s-num gray">${iguales}</div>
        <div class="s-lbl">Sin cambio</div>
      </div>
      ${mejor ? `<div class="summary-card" style="border-color:#00e67644;">
        <div class="s-num green" style="font-size:16px;">${mejor.etiqueta}</div>
        <div class="s-lbl">Mayor mejora (+${(mejor.score ?? 0).toFixed(1)}%)</div>
      </div>` : ''}
      ${peor && peor.score < 0 ? `<div class="summary-card" style="border-color:#ff525244;">
        <div class="s-num red" style="font-size:16px;">${peor.etiqueta}</div>
        <div class="s-lbl">Mayor deterioro (${(peor.score ?? 0).toFixed(1)}%)</div>
      </div>` : ''}
    </div>

    <!-- Gráfica -->
    <div class="chart-container">
      <h3>Impacto porcentual por métrica <span style="color:#666;font-weight:400;font-size:11px;">(+% = mejora respecto al base)</span></h3>
      <canvas id="barChart" height="80"></canvas>
    </div>

    <!-- Tabla detalle -->
    <div class="results-table-wrap">
      <h3>Detalle por métrica</h3>
      <table>
        <thead>
          <tr>
            <th>Métrica</th>
            <th>Orientación</th>
            <th>Base</th>
            <th>Actual</th>
            <th>Δ valor</th>
            <th>Δ %</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          ${resultados.map(r => `
            <tr>
              <td>${r.etiqueta}</td>
              <td style="color:#888;font-size:10px;">${r.sentido === 'higher' ? '↑ mayor es mejor' : '↓ menor es mejor'}</td>
              <td>${fmtNum(r.benchmark)}</td>
              <td>${fmtNum(r.actual)}</td>
              <td style="color:${r.delta > 0 ? '#69f0ae' : r.delta < 0 ? '#ff5252' : '#888'}">${r.delta > 0 ? '+' : ''}${fmtNum(r.delta)}</td>
              <td style="color:#aaa;">${r.delta_pct_valor == null ? 'N/A' : (r.delta_pct_valor > 0 ? '+' : '') + r.delta_pct_valor.toFixed(2) + '%'}</td>
              <td><span class="estado-${r.estado}">${r.estado.replace('_', ' ')}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  // Renderizar Chart.js
  if (chartInstance) { chartInstance.destroy(); }
  const labels = resultados.map(r => r.etiqueta);
  const scores = resultados.map(r => r.score);
  const colors = scores.map(s => s > 0 ? '#00e676cc' : s < 0 ? '#ff5252cc' : '#666');
  const borders = scores.map(s => s > 0 ? '#00e676' : s < 0 ? '#ff5252' : '#555');

  const ctx = document.getElementById('barChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Impacto (%)',
        data: scores,
        backgroundColor: colors,
        borderColor: borders,
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const s = ctx.parsed.x;
              return ` ${s > 0 ? '+' : ''}${s.toFixed(2)}%`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#1e3a5f' },
          ticks: { color: '#888', callback: v => `${v > 0 ? '+' : ''}${v.toFixed(0)}%` },
          border: { color: '#0f3460' },
        },
        y: {
          grid: { color: '#1a1a2e' },
          ticks: { color: '#ccc', font: { size: 11 } },
          border: { color: '#0f3460' },
        }
      }
    }
  });
}

function fmtNum(v) {
  if (v == null || isNaN(v)) return '—';
  if (Number.isInteger(v)) return v.toLocaleString('es-MX');
  if (Math.abs(v) < 1) return v.toFixed(4);
  return v.toFixed(2);
}
</script>
</body>
</html>
