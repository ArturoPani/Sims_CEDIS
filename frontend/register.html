<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEDIS Sim · Registro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 20% 50%, #0d224255 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, #16213e33 0%, transparent 60%);
    }
    .login-card {
      background: #111827;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 40px 36px 32px;
      width: 380px;
      box-shadow: 0 8px 40px #00000080;
    }
    .login-card h1 {
      text-align: center;
      font-size: 22px;
      color: #00d4ff;
      margin-bottom: 6px;
    }
    .login-card .subtitle {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1b2a;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 0 3px #00d4ff22;
    }
    .btn-register {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0f7b6c, #1a9e8f);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 6px;
    }
    .btn-register:hover { opacity: 0.88; }
    .error-msg {
      background: #ff525222;
      border: 1px solid #ff525255;
      color: #ff5252;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 18px;
    }
    .lock-icon {
      text-align: center;
      font-size: 36px;
      margin-bottom: 12px;
    }
    .link-login {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #00d4ff;
      font-size: 13px;
      text-decoration: none;
    }
    .link-login:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="lock-icon">📝</div>
    <h1>CEDIS Sim</h1>
    <p class="subtitle">Crear cuenta nueva</p>

    <div id="errorBox" class="error-msg" style="display:none;"></div>

    <form action="/register" method="POST">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 4 caracteres" autocomplete="new-password" required minlength="4" />
      </div>
      <button type="submit" class="btn-register">Crear cuenta</button>
    </form>

    <a href="/login" class="link-login">¿Ya tienes cuenta? Inicia sesión</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    if (err) {
      const box = document.getElementById('errorBox');
      const msgs = {
        validacion: 'El usuario no puede estar vacío y la contraseña debe tener al menos 4 caracteres.',
        existe: 'Ese nombre de usuario ya está registrado.',
        servidor: 'Error del servidor. Intenta de nuevo.',
      };
      box.textContent = msgs[err] || 'Error desconocido.';
      box.style.display = 'block';
    }
  </script>
</body>
</html>
