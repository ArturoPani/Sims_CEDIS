<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEDIS Sim · Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 20% 50%, #0d224255 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, #16213e33 0%, transparent 60%);
    }
    .login-card {
      background: #111827;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 40px 36px 32px;
      width: 380px;
      box-shadow: 0 8px 40px #00000080;
    }
    .login-card h1 {
      text-align: center;
      font-size: 22px;
      color: #00d4ff;
      margin-bottom: 6px;
    }
    .login-card .subtitle {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1b2a;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 0 3px #00d4ff22;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0f7b6c, #1a9e8f);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 6px;
    }
    .btn-login:hover { opacity: 0.88; }
    .error-msg {
      background: #ff525222;
      border: 1px solid #ff525255;
      color: #ff5252;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 18px;
    }
    .lock-icon {
      text-align: center;
      font-size: 36px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <h1>CEDIS Sim</h1>
    <p class="subtitle">Acceso restringido · Solo administradores</p>

    <div id="errorBox" class="error-msg" style="display:none;">
      Usuario o contraseña incorrectos
    </div>

    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-login">Iniciar sesión</button>
    </form>
  </div>

  <script>
    // Mostrar error si viene de un intento fallido
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('errorBox').style.display = 'block';
    }
  </script>
</body>
</html>
