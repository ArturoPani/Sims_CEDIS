<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEDIS Sim — Experimento Rápido</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    body { height: auto; min-height: 100vh; }

    .page-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 28px 40px;
      gap: 24px;
    }

    /* ── Two-column sim configs ── */
    .configs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .sim-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 18px 20px;
    }
    .sim-card h2 {
      font-size: 14px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sim-card h2 .chip {
      font-size: 10px;
      background: #0f3460;
      color: #00d4ff;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }
    .field-grid .full { grid-column: 1 / -1; }

    .field label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field select,
    .field input[type="number"],
    .field input[type="text"] {
      width: 100%;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #0f3460;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .field select:focus,
    .field input:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 4px rgba(0,212,255,0.3);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #aaa;
    }
    .toggle-row input[type="checkbox"] {
      accent-color: #00d4ff;
    }

    /* ── Actions row ── */
    .actions-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .actions-row button {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
    }
    .actions-row .status-msg {
      font-size: 13px;
      color: #888;
    }
    .actions-row .status-msg.ok { color: #00e676; }
    .actions-row .status-msg.err { color: #ff5252; }
    .actions-row .status-msg.running { color: #ffab40; }

    /* ── Results ── */
    .results-section {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 20px;
      display: none;
    }
    .results-section.visible { display: block; }

    .results-section h2 {
      font-size: 14px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .metrics-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 20px;
    }
    .metrics-table th {
      background: #0f3460;
      color: #00d4ff;
      padding: 8px 12px;
      text-align: left;
    }
    .metrics-table td {
      padding: 6px 12px;
      border-bottom: 1px solid #0f3460;
    }
    .metrics-table tr:hover td { background: rgba(0,212,255,0.05); }
    .metrics-table .better { color: #00e676; font-weight: 600; }
    .metrics-table .worse  { color: #ff5252; font-weight: 600; }
    .metrics-table .neutral { color: #e0e0e0; }

    #chartContainer {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

<!-- ═══ Top bar ═══ -->
<div class="topbar">
  <h1>CEDIS Sim</h1>
  <nav style="display:flex; gap:6px;">
    <a href="/" style="color:#aaa; text-decoration:none; padding:4px 12px; border:1px solid #0f3460; border-radius:4px; font-size:12px;">
      🤖 Simulación
    </a>
    <a href="/metricas-page" style="color:#aaa; text-decoration:none; padding:4px 12px; border:1px solid #0f3460; border-radius:4px; font-size:12px;">
      📊 Métricas
    </a>
    <span style="color:#00d4ff; padding:4px 12px; border:1px solid #00d4ff33; border-radius:4px; font-size:12px; background:#0d2342;">
      🧪 Experimento
    </span>
    <a href="/logout" style="color:#ff5252; text-decoration:none; padding:4px 12px; border:1px solid #ff525244; border-radius:4px; font-size:12px; margin-left:auto;">
      🚪 Salir
    </a>
  </nav>
</div>

<!-- ═══ Page content ═══ -->
<div class="page-wrap">

  <!-- ── Two sim configs side by side ── -->
  <div class="configs-row">

    <!-- Sim A -->
    <div class="sim-card" id="cardA">
      <h2>Simulación A <span class="chip">Izquierda</span></h2>
      <div class="field-grid">
        <div class="field">
          <label>Escenario</label>
          <select id="escA"></select>
        </div>
        <div class="field">
          <label>Robots</label>
          <input type="number" id="robotsA" value="5" min="1" max="96">
        </div>
        <div class="field">
          <label>Semilla (seed)</label>
          <input type="number" id="seedA" value="42" min="0">
        </div>
        <div class="field">
          <label>Pedidos</label>
          <input type="number" id="pedidosA" value="300" min="1" max="5000">
        </div>
        <div class="field">
          <label>Ticks</label>
          <input type="number" id="ticksA" value="10000" min="100" max="100000">
        </div>
        <div class="field" style="display:flex; align-items:end;">
          <div class="toggle-row">
            <input type="checkbox" id="burstA">
            <label for="burstA" style="margin:0; text-transform:none; font-size:12px; color:#aaa;">Burst</label>
          </div>
        </div>
        <div class="field full">
          <div class="toggle-row">
            <input type="checkbox" id="guardarA">
            <label for="guardarA" style="margin:0; text-transform:none; font-size:12px; color:#aaa;">💾 Guardar métricas</label>
            <input type="text" id="nombreA" placeholder="Nombre (opcional)" style="width:160px; margin-left:4px;">
          </div>
        </div>
      </div>
    </div>

    <!-- Sim B -->
    <div class="sim-card" id="cardB">
      <h2>Simulación B <span class="chip">Derecha</span></h2>
      <div class="field-grid">
        <div class="field">
          <label>Escenario</label>
          <select id="escB"></select>
        </div>
        <div class="field">
          <label>Robots</label>
          <input type="number" id="robotsB" value="5" min="1" max="96">
        </div>
        <div class="field">
          <label>Semilla (seed)</label>
          <input type="number" id="seedB" value="42" min="0">
        </div>
        <div class="field">
          <label>Pedidos</label>
          <input type="number" id="pedidosB" value="300" min="1" max="5000">
        </div>
        <div class="field">
          <label>Ticks</label>
          <input type="number" id="ticksB" value="10000" min="100" max="100000">
        </div>
        <div class="field" style="display:flex; align-items:end;">
          <div class="toggle-row">
            <input type="checkbox" id="burstB">
            <label for="burstB" style="margin:0; text-transform:none; font-size:12px; color:#aaa;">Burst</label>
          </div>
        </div>
        <div class="field full">
          <div class="toggle-row">
            <input type="checkbox" id="guardarB">
            <label for="guardarB" style="margin:0; text-transform:none; font-size:12px; color:#aaa;">💾 Guardar métricas</label>
            <input type="text" id="nombreB" placeholder="Nombre (opcional)" style="width:160px; margin-left:4px;">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Run buttons ── -->
  <div class="actions-row">
    <button class="success" id="btnCorrer" onclick="correrAmbas()">▶ Correr ambas simulaciones</button>
    <button id="btnCorrerA" onclick="correrUna('A')">▶ Solo A</button>
    <button id="btnCorrerB" onclick="correrUna('B')">▶ Solo B</button>
    <span class="status-msg" id="statusMsg"></span>
  </div>

  <!-- ── Results ── -->
  <div class="results-section" id="resultsSection">
    <h2>Comparación de resultados</h2>
    <table class="metrics-table" id="tablaResultados">
      <thead>
        <tr>
          <th>Métrica</th>
          <th>Sim A</th>
          <th>Sim B</th>
          <th>Δ</th>
        </tr>
      </thead>
      <tbody id="tbodyResultados"></tbody>
    </table>
    <div id="chartContainer">
      <canvas id="chartComparacion"></canvas>
    </div>
  </div>

</div>

<script src="/static/experimento.js"></script>
</body>
</html>
